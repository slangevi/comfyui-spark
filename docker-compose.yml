# ComfyUI on DGX Spark (GB10). See docs/superpowers/specs/ for the design.
services:
  comfyui:
    build:
      context: .
      args:
        PUID: "${PUID:-1000}"
        PGID: "${PGID:-1000}"
    image: comfyui-spark:latest
    container_name: comfyui
    restart: unless-stopped

    # The pinned ComfyUI registers no SIGTERM handler, and an unhandled
    # signal is IGNORED by PID 1 — so docker's default stop was a 10s hang
    # followed by SIGKILL, truncating any image mid-write. SIGINT is the
    # signal Python always handles (KeyboardInterrupt -> clean shutdown);
    # init:true additionally reaps zombies from custom nodes spawning
    # subprocesses and forwards signals to the python child.
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s

    # These four settings are carried over from the working GB10
    # configuration in sparkyard/docker-compose.yml.
    ipc: host                       # shared memory with the GPU driver
    security_opt:
      - seccomp:unconfined          # low-level CUDA calls
    ulimits:
      memlock: -1                   # unified memory needs unlimited locked pages
      stack: 67108864

    # 127.0.0.1 only — ComfyUI has no authentication.
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"

    volumes:
      # Defaulted, not bare: with an empty value compose fails on an
      # unparseable mount spec rather than telling you .env is missing.
      # Keep this default in step with the Makefile, scripts/fetch-model.sh
      # and spec §7.7.
      - "${COMFYUI_DATA_PATH:-/home/scott/LLMs/comfyui}:/data"

    environment:
      - COMFYUI_ARGS=${COMFYUI_ARGS:---highvram --use-pytorch-cross-attention}
      - COMFYUI_ALLOW_CPU=${COMFYUI_ALLOW_CPU:-0}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Read by every custom node that runs in this container, not just by
      # Manager's model downloader. Use a read-only, minimally-scoped token.
      - HF_TOKEN=${HF_TOKEN:-}
      # Anything ComfyUI-Manager or a custom node's requirements.txt installs
      # at runtime resolves against PyPI by default — including `torch`, which
      # on PyPI is a generic build. The cu130 extra index makes a reinstall
      # land on the same aarch64 CUDA wheels the image was built with, and the
      # image's baked PIP_CONSTRAINT/UV_CONSTRAINT (/opt/constraints.txt) pins
      # the torch trio to those exact builds — so a wrong-build install fails
      # loudly instead of silently shadowing. The entrypoint's pre-launch GPU
      # assertion remains the backstop.
      - PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
      - UV_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
      # entrypoint.sh's MANAGER_REF is deliberately NOT exposed here. See
      # .env.example for why the ComfyUI-Manager pin stays compose-inert.

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      # Not just HTTP 200: /system_stats answers 200 even when ComfyUI is
      # rendering on the CPU — the design's stated worst case. Requiring the
      # primary device to be CUDA means even a Manager in-UI restart (which
      # bypasses the entrypoint via os.execv) flips the container unhealthy
      # within ~retries*interval instead of staying green indefinitely.
      test: ["CMD", "python3", "-c", "import json,os,sys,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8188/system_stats', timeout=8)); sys.exit(0 if (os.environ.get('COMFYUI_ALLOW_CPU')=='1' or (d['devices'] and d['devices'][0]['type']=='cuda')) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Above the 240s cold-start budget verify-http.sh already allows: a
      # first boot builds the overlay venv and clones + installs Manager.
      start_period: 300s
